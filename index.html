<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="DebtFree"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <meta name="description" content="Persönlicher Schulden- und Budgettracker mit Sparkasse-Import. Alle Daten bleiben auf deinem Gerät."/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" type="image/png" href="icon-192.png"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <title>DebtFree</title>
<style>
:root{
  --bg:#0a0a0f; --card:#121219; --card2:#181822; --border:#24243a;
  --text:#ececf4; --muted:#9a9ab4; --faint:#5e5e78;
  --green:#00e5a0; --red:#ff5c78; --amber:#ffb344; --blue:#5c9dff; --purple:#a07cff;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Syne',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;overscroll-behavior-y:none}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#root{max-width:480px;margin:0 auto;min-height:100vh}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .warnc{color:var(--amber)} .mut{color:var(--muted)}

/* ── PIN ── */
.pin-wrap{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px calc(32px + env(safe-area-inset-bottom))}
.pin-logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#00e5a0,#4488ff);display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:18px;box-shadow:0 0 40px rgba(0,229,160,.25)}
.pin-title{font-size:26px;font-weight:800}
.pin-sub{color:var(--muted);font-size:14px;margin:6px 0 22px;text-align:center}
.pin-dots{display:flex;gap:16px;margin-bottom:10px}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--faint);transition:all .15s}
.pin-dot.on{background:var(--green);border-color:var(--green)}
.pin-dot.err{border-color:var(--red)}
.pin-err{color:var(--red);font-size:13px;min-height:20px;margin-bottom:16px;text-align:center}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:270px}
.pk{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);background:var(--card);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.pk:active{transform:scale(.92);background:var(--border)}
.pk.ghost{background:transparent;border:none;cursor:default}
.pk:disabled{opacity:.35}
.pin-link{background:none;border:none;color:var(--muted);font-size:13px;margin-top:22px;text-decoration:underline;text-underline-offset:3px}

/* ── Header ── */
.hdr{padding:calc(22px + env(safe-area-inset-top)) 18px 18px;background:linear-gradient(175deg,#10101f,var(--bg))}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hdr-lbl{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.hdr-amt{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hdr-sub{color:var(--muted);font-size:13px;margin-top:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:5px 12px;font-size:12px;font-weight:700}
.pill.g{background:rgba(0,229,160,.12);border:1px solid rgba(0,229,160,.35);color:var(--green)}
.pill.r{background:rgba(255,92,120,.12);border:1px solid rgba(255,92,120,.35);color:var(--red)}
.pbar{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.pfill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}

/* ── Layout ── */
.content{padding:6px 14px calc(100px + env(safe-area-inset-bottom))}
.stitle{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin:22px 2px 10px;font-weight:700}
.stitle button{letter-spacing:0;text-transform:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.scard-lbl{color:var(--muted);font-size:12px;margin-bottom:6px}
.scard-val{font-size:20px;font-weight:800}
.scard-hint{color:var(--faint);font-size:11px;margin-top:4px}
.note{color:var(--muted);font-size:12px;line-height:1.55}
.alert{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:10px}
.alert.r{background:rgba(255,92,120,.1);border:1px solid rgba(255,92,120,.35);color:#ffc2cd}
.alert.a{background:rgba(255,179,68,.1);border:1px solid rgba(255,179,68,.35);color:#ffe0b0}
.alert.g{background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.3);color:#b6ffe6}

/* ── Debt cards ── */
.dc{background:var(--card);border-radius:18px;padding:15px;margin-bottom:10px;border:1px solid var(--border)}
.dc-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.dc-ico{font-size:22px;width:28px;text-align:center}
.dc-name{font-weight:700;font-size:15px}
.dc-meta{color:var(--muted);font-size:12px;margin-top:2px}
.dc-bal{font-weight:800;font-size:17px;margin-left:auto;text-align:right}
.dc-bot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.dc-pct{font-size:12px;font-weight:700}
.dc-actions{display:flex;gap:8px}
.chipbtn{border:1px solid var(--border);border-radius:20px;padding:6px 13px;background:transparent;font-size:13px;font-weight:700;color:var(--muted)}
.chipbtn.on{border-color:var(--green);color:var(--green);background:rgba(0,229,160,.08)}
.paybtn{border:1px solid;border-radius:20px;padding:6px 14px;background:transparent;font-size:13px;font-weight:700}
.done-badge{font-size:12px;font-weight:700;color:var(--green)}

/* ── Buttons & forms ── */
.btn-p{background:var(--green);border:none;border-radius:14px;padding:14px;color:#00170f;font-weight:800;font-size:15px;width:100%}
.btn-g{background:transparent;border:1px solid var(--border);border-radius:14px;padding:13px;color:var(--text);font-weight:600;font-size:14px;width:100%}
.btn-d{background:transparent;border:1px solid rgba(255,92,120,.5);border-radius:14px;padding:13px;color:var(--red);font-weight:700;font-size:14px;width:100%}
.btn-row{display:flex;gap:10px;margin-top:6px}
.btn-row>*{flex:1}
.lbl{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px;font-weight:600}
.ifield{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:16px;margin-bottom:12px;outline:none}
.ifield:focus{border-color:var(--green)}
select.ifield option{background:var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:9px 6px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.emoji-row button{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg);font-size:19px}
.emoji-row button.on{border-color:var(--green);background:rgba(0,229,160,.1)}

/* ── Lists ── */
.li{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border);width:100%;text-align:left}
.li-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.li-main{flex:1;min-width:0}
.li-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-amt{font-weight:700;font-size:14px;white-space:nowrap}
.month-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:18px 4px 8px;font-weight:700}
.empty{text-align:center;padding:44px 20px}
.empty-ico{font-size:44px}
.empty-t{font-weight:700;margin-top:10px}
.empty-s{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar .ifield{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

/* ── Budget ── */
.bi{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px;color:var(--muted)}
.bi.total{border-top:1px solid var(--border);margin-top:8px;padding-top:10px;color:var(--text);font-weight:700}
.aedit{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px 10px}
.aedit:focus-within{border-color:var(--green)}
.einput{background:transparent;border:none;font-weight:700;font-size:15px;width:84px;outline:none;text-align:right;font-family:var(--mono)}
.esign{color:var(--muted);font-size:13px;margin-left:4px}

/* ── Analytics ── */
.upload-zone{display:block;border:2px dashed var(--border);border-radius:16px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:12px;width:100%;background:transparent}
.upload-zone:hover,.upload-zone.drag{border-color:var(--green);background:rgba(0,229,160,.04)}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:13px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-item{margin-bottom:13px}
.bar-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px;gap:8px}
.bar-track{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px}
.insight{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;border:1px solid var(--border)}
.insight.warn{border-left:3px solid var(--red)} .insight.good{border-left:3px solid var(--green)} .insight.info{border-left:3px solid var(--blue)}
.insight-ico{font-size:20px;flex-shrink:0}
.insight-t{font-weight:700;font-size:14px;margin-bottom:3px}
.insight-b{color:var(--muted);font-size:13px;line-height:1.5}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--green);animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
svg text{font-family:var(--mono)}

/* ── Plan ── */
.plan-hero{background:linear-gradient(135deg,#10102a,#0a1a2c);border-radius:22px;padding:24px;text-align:center;margin-bottom:10px;border:1px solid #1d2d46}
.ph-num{font-size:54px;font-weight:800;color:var(--green);line-height:1;margin:8px 0 6px}
.phase{background:var(--card);border-radius:15px;padding:14px 15px;margin-bottom:9px;border:1px solid var(--border);border-left:4px solid}
.phase-chips{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--green);margin:10px 0 4px}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;z-index:1100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mbox{background:var(--card);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:480px;margin:0 auto;border-top:1px solid var(--border);max-height:92vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mhandle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px}
.mtitle{font-weight:800;font-size:19px;margin-bottom:16px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}

/* ── Nav / FAB / Toast ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(10,10,15,.96);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100}
.nb{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:4px 0;transition:color .15s}
.nb.on{color:var(--green)}
.nb-ico{font-size:20px}
.nb-lbl{font-size:11px;font-weight:700}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:max(18px,calc(50% - 222px));width:56px;height:56px;border-radius:50%;background:var(--green);border:none;color:#00170f;font-size:28px;font-weight:700;z-index:90;box-shadow:0 4px 24px rgba(0,229,160,.3);display:flex;align-items:center;justify-content:center}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:2000;width:max-content;max-width:calc(100% - 32px)}
.toast{display:flex;align-items:center;gap:12px;padding:11px 18px;border-radius:30px;font-weight:700;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:tin .25s ease}
.toast.ok{background:var(--green);color:#00170f}
.toast.err{background:var(--red);color:#fff}
.toast button{background:rgba(0,0,0,.18);border:none;border-radius:20px;padding:4px 12px;font-weight:800;font-size:13px}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.fade{animation:fin .25s ease both}
@keyframes fin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="pin-screen"></div>
<div id="root" hidden></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="file-csv" type="file" accept=".csv,text/csv,text/plain" hidden/>
<input id="file-backup" type="file" accept=".json,application/json" hidden/>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════════════════
//  DebtFree — local-first debt & budget tracker. No server, no tracking.
//  All data lives in this browser's localStorage (key: df4).
// ════════════════════════════════════════════════════════════════════════════

const STORE_KEY='df4', LEGACY_KEY='df3';
const PIN_KEY='df4_pin', LEGACY_PIN_KEY='df3_pin', PIN_FAIL_KEY='df4_pinfail';
const AUTOLOCK_MS=5*60*1000;
const MAX_SIM_MONTHS=600;

// ── Categories ───────────────────────────────────────────────────────────────
const CAT_COLORS={
  'Lebensmittel':'#ff9944','Drogerie':'#ff44aa','Tankstelle':'#44ddff','Öffis':'#3fb8ff','Parken':'#2a9fd6',
  'Restaurant':'#ff6644','Lieferservice':'#ff8a5c','Online-Shopping':'#9966ff','Bekleidung':'#b388ff',
  'Elektronik':'#7c4dff','Wohnen':'#8e7cc3','Abos':'#ff4466','Nebenkosten':'#4488ff','Telefon/Internet':'#6aa6ff',
  'Gesundheit':'#2ee6a8','Sport':'#5ad1a0','Miete':'#6644ff','Versicherung':'#a08cff','Bargeld':'#d4b13a',
  'Schuldentilgung':'#ffb344','Gebühren':'#a0a0b0','Überweisung':'#8a8aa0','Sonstiges':'#6c6c8c',
  'Einkommen':'#00e5a0','Sonstige Einnahme':'#55c9a0',
};
const EXPENSE_CATS=Object.keys(CAT_COLORS).filter(c=>!['Einkommen','Sonstige Einnahme'].includes(c));
const INCOME_CATS=['Einkommen','Sonstige Einnahme'];
// Categories that move money to debts rather than consume it — excluded from "Konsum" analytics.
const NON_CONSUMPTION=new Set(['Schuldentilgung']);

// Keyword → category. Matched on word boundaries against payee + purpose + booking text.
// Longer keywords are tried first so e.g. "amazon prime" wins over "amazon".
const KEYWORDS={
  'Lebensmittel':['edeka','rewe','aldi','lidl','netto','penny','kaufland','norma','tegut','globus','marktkauf','denns','alnatura','*bäckerei','*baeckerei','backerei','bäcker','*metzgerei','metzger','supermarkt'],
  'Drogerie':['dm','dm-drogerie','dm drogerie','rossmann','drogerie müller','mueller drogerie','budni'],
  'Tankstelle':['shell','aral','esso','jet tankstelle','totalenergies','total tankstelle','agip','*tankstelle','star tankstelle','avia'],
  'Öffis':['deutsche bahn','db vertrieb','db fernverkehr','db regio','bahn.de','mvv','hvv','bvg','vrr','rmv','vvs','kvb','vbb','flixbus','flixtrain','deutschlandticket'],
  'Parken':['*parkhaus','parking','parken','parkgebühr*','apcoa','contipark','easypark','parkster','park and joy'],
  'Restaurant':['restaurant','gasthaus','gaststätte','gaststaette','pizzeria','pizza','döner','doener','kebap','kebab','mcdonalds',"mcdonald's",'mcdonald','burger king','subway','kfc','starbucks','vapiano','imbiss','café','cafe'],
  'Lieferservice':['lieferando','uber eats','wolt','deliveroo','flink','gorillas'],
  'Online-Shopping':['amazon','amzn','zalando','ebay','otto.de','otto gmbh','temu','shein','aliexpress','about you'],
  'Bekleidung':['h&m','zara','primark','c&a','deichmann','snipes','tk maxx'],
  'Elektronik':['saturn','media markt','mediamarkt','cyberport','notebooksbilliger','conrad'],
  'Wohnen':['ikea','obi','bauhaus','hornbach','toom','poco','jysk','xxxlutz','roller'],
  'Abos':['netflix','spotify','amazon prime','prime video','disney plus','disney+','dazn','sky deutschland','wow tv','playstation','xbox','apple.com','itunes','youtube premium','audible','chatgpt','openai','icloud'],
  'Nebenkosten':['stadtwerke*','strom*','gas','*energie gmbh','e.on','eon energie','vattenfall','enbw','rwe','beitragsservice','rundfunkbeitrag','ard zdf','nebenkosten','wasserversorgung'],
  'Telefon/Internet':['telekom','vodafone','o2','telefonica','1&1','congstar','freenet','aldi talk','unitymedia','internet'],
  'Gesundheit':['*apotheke','arzt','zahnarzt','praxis','krankenhaus','*klinik','optiker','fielmann'],
  'Sport':['fitness*','mcfit','clever fit','fitx','urban sports','john reed'],
  'Miete':['*miete','mietzahlung','hausverwaltung','vonovia','wohnungsbau','wohnungsgenossenschaft'],
  'Versicherung':['*versicherung*','allianz','huk','huk-coburg','axa','ergo','generali','debeka','devk','signal iduna','r+v','barmenia','check24 versicherung'],
  'Bargeld':['geldautomat','bargeldauszahlung','bargeld','auszahlung gaa','gaa'],
  'Schuldentilgung':['kreditkarte*','*darlehen*','*tilgung','ratenkredit','kreditrate','santander','barclays','advanzia','consors finanz','targobank','kfw'],
  'Gebühren':['*entgelt*','kontoführung*','kontofuehrung*','*gebühr*','*gebuehr*','abschluss','sollzinsen'],
};
const INCOME_KEYWORDS=['gehalt*','lohn','*lohn','bezüge','bezuege','rente','kindergeld','arbeitslosengeld','bundesagentur für arbeit','elterngeld','krankengeld'];

const KW_LIST=Object.entries(KEYWORDS)
  .flatMap(([cat,kws])=>kws.map(k=>({k,cat,re:wordRe(k)})))
  .sort((a,b)=>b.k.length-a.k.length);
const INCOME_RES=INCOME_KEYWORDS.map(wordRe);

// Keywords match whole words. A leading/trailing "*" lets the keyword sit inside a German
// compound word, e.g. "*versicherung" also matches "Haftpflichtversicherung".
function wordRe(kw){
  const pre=kw.startsWith('*'),post=kw.endsWith('*');
  const e=kw.replace(/^\*|\*$/g,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const B='[^a-z0-9äöüß]';
  return new RegExp((pre?'':'(^|'+B+')')+e+(post?'':'(?=$|'+B+')'));
}
function payeeKey(s){return String(s||'').toLowerCase().replace(/[0-9]/g,'').replace(/[^a-zäöüß&+ ]/g,' ').replace(/\s+/g,' ').trim().slice(0,40);}
function catColor(c){return CAT_COLORS[c]||'#6c6c8c';}

const ruleKey=(payee,isIncome)=>(isIncome?'in:':'out:')+payeeKey(payee);
function categorize(payee,text,isIncome){
  const rule=S.rules[ruleKey(payee,isIncome)];
  if(rule)return rule;
  const lower=(payee+' '+text).toLowerCase();
  if(isIncome){
    if(INCOME_RES.some(re=>re.test(lower)))return 'Einkommen';
    return 'Sonstige Einnahme';
  }
  for(const {re,cat} of KW_LIST){if(re.test(lower))return cat;}
  return 'Sonstiges';
}

const NF2=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});

/** Parses user input like "1.234,56", "1234.56", "1234,5 €". Returns NaN when invalid. */
function parseNum(v){
  if(typeof v==='number')return v;
  let s=String(v??'').replace(/[€\s ]/g,'');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');   // "1.234" → 1234
  return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN;
}

// ── Debt payoff simulation ───────────────────────────────────────────────────
/**
 * Month-by-month simulation: interest accrues, minimums are paid, and the rest of the
 * monthly budget goes to one target debt (avalanche = highest APR, snowball = lowest balance).
 * Freed-up minimums roll over automatically because the monthly budget stays constant.
 */
function simulate(debts,budget,strategy,extra=0){
  let ds=debts.filter(d=>d.balance>0.005).map(d=>({id:d.id,bal:d.balance,apr:d.apr,min:d.min}));
  const minSum=sum(ds,d=>d.min);
  const pay=budget+extra;
  const res={months:0,interest:0,payoff:{},first:{},timeline:[sum(ds,d=>d.bal)],feasible:true,reason:'',minSum,pay};
  if(!ds.length)return res;
  if(pay<=0){res.feasible=false;res.reason='budget';return res;}
  if(pay+0.005<minSum){res.feasible=false;res.reason='min';res.shortfall=minSum-pay;}
  const order=()=>[...ds].filter(d=>d.bal>0.005).sort(strategy==='snowball'
    ?(a,b)=>a.bal-b.bal||b.apr-a.apr
    :(a,b)=>b.apr-a.apr||a.bal-b.bal);
  for(let m=1;m<=MAX_SIM_MONTHS;m++){
    const alloc={};
    for(const d of ds){if(d.bal>0.005){const i=d.bal*d.apr/1200;d.bal+=i;res.interest+=i;}}
    let rem=pay;
    for(const d of ds){if(d.bal>0.005&&rem>0){const p=Math.min(d.min,d.bal,rem);d.bal-=p;rem-=p;alloc[d.id]=(alloc[d.id]||0)+p;}}
    for(const d of order()){if(rem<=0.005)break;const p=Math.min(rem,d.bal);d.bal-=p;rem-=p;alloc[d.id]=(alloc[d.id]||0)+p;}
    for(const d of ds){if(d.bal<=0.005&&res.payoff[d.id]==null){d.bal=0;res.payoff[d.id]=m;}}
    if(m===1)res.first=alloc;
    const total=sum(ds,d=>d.bal);
    res.timeline.push(total);
    res.months=m;
    if(total<=0.005)return res;
  }
  res.feasible=false;if(!res.reason)res.reason='stall';
  return res;
}

function figures(){
  const totalDebt=sum(S.debts,d=>d.balance);
  const totalOrig=sum(S.debts,d=>d.orig);
  const totalExp=sum(S.expenses,e=>e.amount);
  const budget=S.income-totalExp;             // available for all debt payments
  const minSum=sum(S.debts.filter(d=>d.balance>0),d=>d.min);
  const extra=budget-minSum;                   // on top of minimums
  const sim=simulate(S.debts,budget,S.strategy);
  return {totalDebt,totalOrig,totalExp,budget,minSum,extra,sim};
}

// ── CSV import (Sparkasse CSV-CAMT V2 / CSV-MT940 and most German bank exports) ──
function decodeBytes(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch{return new TextDecoder('windows-1252').decode(buf);}   // Sparkasse exports are usually ISO-8859-1
}
function parseCSV(text,sep){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=c;
    }else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur='';}
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(cur);cur='';
      if(row.some(x=>x.trim()))rows.push(row.map(x=>x.trim()));
      row=[];
    }else cur+=c;
  }
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row.map(x=>x.trim()));
  return rows;
}
const normHead=h=>h.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z]/g,'');
function findCol(heads,cands){
  for(const c of cands){const i=heads.indexOf(c);if(i>=0)return i;}
  for(const c of cands){const i=heads.findIndex(h=>h.startsWith(c));if(i>=0)return i;}
  return -1;
}
function parseDate(s){
  let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})$/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?`${m[1]}-${m[2]}-${m[3]}`:null;
}
function parseAmount(s){
  let t=String(s).replace(/[€\s ]|EUR/gi,'');
  let neg=false;
  if(t.endsWith('-')){neg=true;t=t.slice(0,-1);}
  if(t.startsWith('-')){neg=true;t=t.slice(1);}else if(t.startsWith('+'))t=t.slice(1);
  if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');
  const n=parseFloat(t);
  return isNaN(n)?NaN:(neg?-n:n);
}

function parseBankCSV(text){
  text=text.replace(/^﻿/,'');
  const firstLines=text.split(/\r?\n/).slice(0,20).join('\n');
  const sep=(firstLines.match(/;/g)||[]).length>=(firstLines.match(/,/g)||[]).length?';':',';
  const rows=parseCSV(text,sep);
  let hi=-1,heads=[];
  for(let i=0;i<Math.min(rows.length,25);i++){
    const h=rows[i].map(normHead);
    if(h.some(x=>x.includes('betrag')||x==='umsatz')&&h.some(x=>/^(buchungstag|buchungsdatum|buchung|datum|valutadatum|wertstellung)$/.test(x))){hi=i;heads=h;break;}
  }
  if(hi<0)throw new Error('Spaltenüberschriften nicht gefunden. Bitte als CSV-CAMT V2 (Sparkasse) oder CSV mit Spalten „Buchungstag“ und „Betrag“ exportieren.');
  const col={
    date:findCol(heads,['buchungstag','buchungsdatum','buchung','datum','valutadatum','wertstellung']),
    amount:findCol(heads,['betrag','betrageur','betragineur','umsatz']),
    payee:findCol(heads,['beguenstigterzahlungspflichtiger','auftraggeberbeguenstigter','auftraggeberempfaenger','zahlungsempfaengerin','zahlungsempfaenger','empfaenger','beguenstigter','auftraggeber','name']),
    purpose:findCol(heads,['verwendungszweck','buchungsdetails']),
    btext:findCol(heads,['buchungstext','umsatzart','vorgang']),
    info:findCol(heads,['info']),
  };
  if(col.date<0||col.amount<0)throw new Error('Datums- oder Betragsspalte fehlt.');
  const out=[];let skipped=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];
    const date=parseDate(r[col.date]||'');
    const amt=parseAmount(r[col.amount]||'');
    if(!date||isNaN(amt)||amt===0){skipped++;continue;}
    if(col.info>=0&&/vorgemerkt|nicht ausgef/i.test(r[col.info]||'')){skipped++;continue;} // pending bookings
    const payee=(col.payee>=0?r[col.payee]:'')||'';
    const purpose=((col.purpose>=0?r[col.purpose]:'')||'').replace(/\s+/g,' ');
    const btext=(col.btext>=0?r[col.btext]:'')||'';
    const isIncome=amt>0;
    const description=(payee||btext||purpose||'Buchung').replace(/\s+/g,' ').slice(0,70);
    out.push({id:uid(),date,description,purpose:purpose.slice(0,140),amount:Math.abs(round2(amt)),
      type:isIncome?'einnahme':'ausgabe',category:categorize(payee||description,purpose+' '+btext,isIncome),src:'import'});
  }
  if(!out.length)throw new Error('Keine Buchungen gefunden. Ist der gewählte Zeitraum leer?');
  return {txs:out,skipped};
}

/** Adds imported rows, skipping ones already present (same date, amount, payee, purpose). Identical
 *  rows inside one file are kept as separate bookings via an occurrence counter. */
function mergeImported(txs){
  const key=t=>[t.date,t.type,t.amount.toFixed(2),payeeKey(t.description),payeeKey(t.purpose).slice(0,30)].join('|');
  const have={};
  for(const t of S.transactions)if(t.src==='import'){const k=key(t);have[k]=(have[k]||0)+1;}
  const seen={};const add=[];
  for(const t of txs){const k=key(t);seen[k]=(seen[k]||0)+1;if(seen[k]>(have[k]||0))add.push(t);}
  S.transactions=[...add,...S.transactions];
  sortTx(S.transactions);
  return {added:add.length,dupes:txs.length-add.length};
}

async function importFile(file){
  if(!file)return;
  if(/\.pdf$/i.test(file.name)||file.type.includes('pdf')){toast('PDF wird nicht unterstützt – bitte als CSV exportieren.','err');return;}
  U.loading=true;U.importMsg=null;S.tab='analytics';render();
  try{
    const text=decodeBytes(await file.arrayBuffer());
    const {txs,skipped}=parseBankCSV(text);
    const {added,dupes}=mergeImported(txs);
    save();
    U.importMsg={type:'g',text:`${added} neue Buchungen importiert${dupes?`, ${dupes} bereits vorhanden`:''}${skipped?`, ${skipped} Zeilen übersprungen`:''}.`};
    toast(`${added} Buchungen importiert`);
  }catch(e){
    U.importMsg={type:'r',text:e.message||'Datei konnte nicht gelesen werden.'};
    toast('Import fehlgeschlagen','err');
  }
  U.loading=false;render();
}

function monthsBack(ym,n){const [y,m]=ym.split('-').map(Number);const d=new Date(y,m-1-n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function buildAnalytics(range){
  let txs=S.transactions;
  if(!txs.length)return null;
  const lastMonth=txs[0].date.slice(0,7);
  if(range!=='all'){const from=monthsBack(lastMonth,+range-1);txs=txs.filter(t=>t.date.slice(0,7)>=from);}
  const out=txs.filter(t=>t.type==='ausgabe');
  const consum=out.filter(t=>!NON_CONSUMPTION.has(t.category));
  const debtPay=out.filter(t=>NON_CONSUMPTION.has(t.category));
  const inc=txs.filter(t=>t.type==='einnahme');
  const monthSet=new Set(txs.map(t=>t.date.slice(0,7)));
  const nMonths=Math.max(1,monthSet.size);
  const catMap={};
  for(const t of consum){(catMap[t.category]??={name:t.category,total:0,count:0,payees:new Set()});const c=catMap[t.category];c.total+=t.amount;c.count++;c.payees.add(payeeKey(t.description));}
  const cats=Object.values(catMap).sort((a,b)=>b.total-a.total);
  const monthMap={};
  for(const m of monthSet)monthMap[m]=0;
  for(const t of consum)monthMap[t.date.slice(0,7)]+=t.amount;
  const months=Object.entries(monthMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
  const totalOut=sum(consum,t=>t.amount);
  const totalIn=sum(inc,t=>t.amount);
  const totalDebtPay=sum(debtPay,t=>t.amount);
  const avgOut=totalOut/nMonths, avgIn=totalIn/nMonths;
  return {cats,months,totalOut,totalIn,totalDebtPay,avgOut,avgIn,nMonths,txCount:txs.length,
    from:txs[txs.length-1].date,to:txs[0].date};
}
function buildInsights(a,f){
  const ins=[];
  const top=a.cats[0];
  if(top&&a.totalOut>0){
    ins.push({type:'info',ico:'🔎',title:`${top.name} ist deine größte Ausgabe`,
      body:`Ø ${fmt(top.total/a.nMonths)} pro Monat – ${Math.round(top.total/a.totalOut*100)} % deiner Konsumausgaben.`});
  }
  const gastro=a.cats.filter(c=>c.name==='Restaurant'||c.name==='Lieferservice');
  const gastroM=sum(gastro,c=>c.total)/a.nMonths;
  if(gastroM>150){
    const save=gastroM/2, sim2=simulate(S.debts,f.budget,S.strategy,save);
    const gain=f.sim.feasible&&sim2.feasible?f.sim.months-sim2.months:0;
    ins.push({type:'warn',ico:'🍔',title:'Hohe Gastro-Ausgaben',
      body:`Ø ${fmt(gastroM)} pro Monat für Restaurants & Lieferdienste. Halbiert wären das ${fmt(save)} mehr für die Tilgung${gain>0?` – ${gain} ${gain===1?'Monat':'Monate'} früher schuldenfrei`:''}.`});
  }
  const subs=a.cats.find(c=>c.name==='Abos');
  if(subs){
    ins.push({type:'info',ico:'📺',title:`${subs.payees.size} ${subs.payees.size===1?'Abo-Anbieter':'Abo-Anbieter'} gefunden`,
      body:`Ø ${fmt(subs.total/a.nMonths)} pro Monat. Kündige, was du nicht wirklich nutzt – jeder Euro geht direkt in die Tilgung.`});
  }
  if(f.totalExp>0&&a.nMonths>=2){
    const diff=a.avgOut-f.totalExp;
    if(diff>50)ins.push({type:'warn',ico:'📋',title:'Ausgaben über deinem Budget',
      body:`Laut Kontoauszug gibst du Ø ${fmt(a.avgOut)} im Monat aus, dein Budget plant ${fmt(f.totalExp)}. Passe das Budget an, sonst ist dein Tilgungsplan zu optimistisch.`});
    else ins.push({type:'good',ico:'✅',title:'Ausgaben im Rahmen',
      body:`Ø ${fmt(a.avgOut)} pro Monat – innerhalb deines geplanten Budgets von ${fmt(f.totalExp)}.`});
  }
  if(S.income>0&&a.avgIn>0&&a.nMonths>=2&&Math.abs(a.avgIn-S.income)/S.income>0.1){
    ins.push({type:'info',ico:'💶',title:'Einkommen weicht ab',
      body:`Die Einnahmen im Auszug liegen bei Ø ${fmt(a.avgIn)}/Monat, im Budget stehen ${fmt(S.income)}. Prüfe den Wert im Budget.`});
  }
  return ins;
}

function donutSVG(cats,total){
  const r=52,C=2*Math.PI*r;let off=0;
  const top=cats.slice(0,6);const rest=total-sum(top,c=>c.total);
  const segs=[...top.map(c=>({v:c.total,col:catColor(c.name)})),...(rest>0.5?[{v:rest,col:'#3a3a52'}]:[])];
  const arcs=segs.map(s=>{const len=s.v/total*C;const el=`<circle cx="65" cy="65" r="${r}" fill="none" stroke="${s.col}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 65 65)"/>`;off+=len;return el;}).join('');
  return `<svg width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="Ausgaben nach Kategorie">${arcs}
    <text x="65" y="62" text-anchor="middle" fill="#9a9ab4" font-size="10">gesamt</text>
    <text x="65" y="77" text-anchor="middle" fill="#ececf4" font-size="12" font-weight="700">${esc(fmt(total))}</text></svg>`;
}
function barsSVG(months,budgetLine){
  if(!months.length)return '';
  const W=320,H=150,pb=22,pt=14;
  const max=Math.max(...months.map(m=>m[1]),budgetLine||0)*1.12||1;
  const bw=W/months.length;
  const bars=months.map(([ym,v],i)=>{
    const h=(v/max)*(H-pb-pt);const x=i*bw+bw*.18;const y=H-pb-h;
    const over=budgetLine>0&&v>budgetLine;
    return `<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,1)}" rx="4" fill="${over?'#ff5c78':'#00e5a0'}" opacity=".85"><title>${monthLabel(ym)}: ${fmt(v)}</title></rect>
      <text x="${x+bw*.32}" y="${H-6}" text-anchor="middle" fill="#9a9ab4" font-size="10">${DE_MONTHS[+ym.slice(5)-1]}</text>`;
  }).join('');
  const by=budgetLine>0?H-pb-(budgetLine/max)*(H-pb-pt):null;
  const line=by!=null?`<line x1="0" x2="${W}" y1="${by}" y2="${by}" stroke="#ffb344" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-2}" y="${by-4}" text-anchor="end" fill="#ffb344" font-size="10">Budget ${esc(fmt(budgetLine))}</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monatliche Ausgaben">${bars}${line}</svg>`;
}
function timelineSVG(series){
  const W=320,H=120,pad=6;
  const all=series.flatMap(s=>s.data);const max=Math.max(...all,1);const len=Math.max(...series.map(s=>s.data.length));
  const path=d=>d.map((v,i)=>`${i?'L':'M'}${(pad+(i/Math.max(1,len-1))*(W-2*pad)).toFixed(1)},${(H-pad-(v/max)*(H-2*pad)).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Verlauf der Restschuld">
    ${series.map(s=>`<path d="${path(s.data)}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`).join('')}</svg>`;
}

// ── PIN lock ─────────────────────────────────────────────────────────────────
// A 4-digit PIN keeps casual onlookers out. It is NOT encryption: anyone with access to the
// browser's developer tools can read localStorage. The PIN itself is stored only as a salted hash.
const P={digits:[],step:1,first:'',err:'',mode:'unlock'};
let lockTimer=null;
function pinRecord(){try{const v=localStorage.getItem(PIN_KEY);return v&&v!=='off'?JSON.parse(v):null;}catch{return null;}}
function pinDisabled(){try{return localStorage.getItem(PIN_KEY)==='off';}catch{return false;}}
function legacyPin(){try{return localStorage.getItem(LEGACY_PIN_KEY)||'';}catch{return '';}}
async function hashPin(pin,salt){
  const data=new TextEncoder().encode(salt+':'+pin);
  if(crypto.subtle){const h=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  let h=2166136261;for(const b of data){h^=b;h=Math.imul(h,16777619)>>>0;}return 'fnv'+h.toString(16);
}
async function storePin(pin){
  const salt=uid();localStorage.setItem(PIN_KEY,JSON.stringify({salt,hash:await hashPin(pin,salt)}));
  localStorage.removeItem(LEGACY_PIN_KEY);
}
function failState(){try{return JSON.parse(localStorage.getItem(PIN_FAIL_KEY))||{n:0,until:0};}catch{return {n:0,until:0};}}
function setFail(f){try{localStorage.setItem(PIN_FAIL_KEY,JSON.stringify(f));}catch{}}

function needsPin(){return !!pinRecord()||!!legacyPin();}
function showPin(mode){P.digits=[];P.step=1;P.first='';P.err='';P.mode=mode;$('pin-screen').hidden=false;$('root').hidden=true;renderPIN();}
function renderPIN(){
  const el=$('pin-screen');
  const setup=P.mode==='setup';
  const f=failState();const locked=!setup&&f.until>Date.now();
  const secs=Math.ceil((f.until-Date.now())/1000);
  const lbl=setup?(P.step===1?'Neuen 4-stelligen PIN wählen':'PIN wiederholen'):'PIN eingeben';
  el.innerHTML=`<div class="pin-wrap">
    <div class="pin-logo" aria-hidden="true">💰</div>
    <div class="pin-title">DebtFree</div>
    <div class="pin-sub">${lbl}</div>
    <div class="pin-dots" aria-label="${P.digits.length} von 4 Ziffern">${[0,1,2,3].map(i=>`<div class="pin-dot ${P.digits.length>i?'on':''} ${P.err?'err':''}"></div>`).join('')}</div>
    <div class="pin-err" role="alert">${locked?`Zu viele Versuche – warte ${secs} s`:esc(P.err)}</div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pk" data-pin="${n}" ${locked?'disabled':''}>${n}</button>`).join('')}
      <div class="pk ghost"></div>
      <button class="pk" data-pin="0" ${locked?'disabled':''}>0</button>
      <button class="pk" data-pin="del" aria-label="Löschen">⌫</button>
    </div>
    ${setup?`<button class="pin-link" data-pin="skip">${S.onboarded?'Abbrechen':'Ohne PIN fortfahren'}</button>`
           :`<button class="pin-link" data-pin="forgot">PIN vergessen?</button>`}
  </div>`;
  clearTimeout(lockTimer);
  if(locked)lockTimer=setTimeout(renderPIN,1000);
}
function pinKey(k){
  if(k==='del'){P.digits.pop();P.err='';renderPIN();return;}
  if(k==='skip'){
    if(!pinRecord()&&!S.onboarded){try{localStorage.setItem(PIN_KEY,'off');}catch{}}
    unlockApp();return;
  }
  if(k==='forgot'){forgotPin();return;}
  if(P.mode!=='setup'&&failState().until>Date.now())return;
  if(P.digits.length>=4)return;
  P.digits.push(k);P.err='';renderPIN();
  if(P.digits.length===4)setTimeout(pinSubmit,120);
}
async function pinSubmit(){
  const entered=P.digits.join('');
  if(P.mode==='setup'){
    if(P.step===1){P.first=entered;P.step=2;P.digits=[];renderPIN();return;}
    if(entered===P.first){await storePin(entered);toast('PIN gespeichert');unlockApp();}
    else{P.err='PINs stimmen nicht überein';P.digits=[];P.step=1;P.first='';renderPIN();}
    return;
  }
  const rec=pinRecord();
  const ok=rec?(await hashPin(entered,rec.salt))===rec.hash:entered===legacyPin();
  if(ok){
    if(!rec)await storePin(entered);   // migrate plaintext v3 PIN to salted hash
    setFail({n:0,until:0});unlockApp();
  }else{
    const f=failState();f.n++;
    if(f.n>=5)f.until=Date.now()+Math.min(15*60,30*2**(f.n-5))*1000;
    setFail(f);P.err='Falscher PIN';P.digits=[];renderPIN();
  }
}
function forgotPin(){
  confirmDialog('PIN vergessen?','Ohne PIN lassen sich die Daten nicht entsperren. Du kannst alle Daten auf diesem Gerät löschen und neu starten (ein vorher erstelltes Backup kannst du danach wieder einspielen).','Alles löschen',()=>{
    wipeAll();location.reload();
  });
}
function wipeAll(){[STORE_KEY,LEGACY_KEY,PIN_KEY,LEGACY_PIN_KEY,PIN_FAIL_KEY].forEach(k=>{try{localStorage.removeItem(k);}catch{}});}
function unlockApp(){
  U.unlocked=true;$('pin-screen').hidden=true;$('pin-screen').innerHTML='';$('root').hidden=false;
  if(!S.onboarded&&!S.debts.length&&!S.income){openModal({type:'welcome'});}
  render();
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return;}
  if(U.unlocked&&needsPin()&&hiddenAt&&Date.now()-hiddenAt>AUTOLOCK_MS){U.unlocked=false;closeModal();showPin('unlock');}
});

let toastTimer=null,toastUndo=null;
function toast(msg,type='ok',undo=null){

  $('toast').innerHTML=`<div class="toast ${type}"><span>${esc(msg)}</span>${undo?'<button data-act="undo">Rückgängig</button>':''}</div>`;

function whatIfText(f,simW){
  if(!U.whatIf)return 'Schiebe den Regler, um zu sehen, was zusätzliche Tilgung bringt.';

function txRow(t){
  return `<button class="li" data-act="editTx" data-id="${esc(t.id)}">

  </button>`;
}
function filteredTxs(){
  const q=U.txQuery.trim().toLowerCase();
  return S.transactions.filter(t=>(!U.txCat||t.category===U.txCat)&&(!q||(t.description+' '+t.purpose+' '+t.category).toLowerCase().includes(q)));
}
function txListHTML(){
  const list=filteredTxs();
  if(!S.transactions.length)return `<div class="empty"><div class="empty-ico">💸</div><div class="empty-t">Noch keine Buchungen</div>
    <div class="empty-s">Importiere deinen Kontoauszug als CSV oder tippe auf ＋, um eine Buchung manuell zu erfassen.</div></div>`;
  if(!list.length)return '<div class="empty"><div class="empty-s">Keine Treffer.</div></div>';
  let html='',cur='';
  const shown=list.slice(0,U.txLimit);
  const monthSums={};
  for(const t of list){const m=t.date.slice(0,7);monthSums[m]??={o:0,i:0};monthSums[m][t.type==='ausgabe'?'o':'i']+=t.amount;}
  for(const t of shown){
    const m=t.date.slice(0,7);
    if(m!==cur){cur=m;html+=`<div class="month-h"><span>${monthLabel(m)}</span><span class="num"><span class="pos">+${fmt(monthSums[m].i)}</span> · <span class="neg">−${fmt(monthSums[m].o)}</span></span></div>`;}
    html+=txRow(t);
  }
  if(list.length>shown.length)html+=`<button class="btn-g" data-act="moreTx">Weitere ${list.length-shown.length} anzeigen</button>`;
  return html;
}
function renderTxs(){
  const cats=[...new Set(S.transactions.map(t=>t.category))].sort();

// ── Actions ──────────────────────────────────────────────────────────────────
function loadSample(){
  S.debts=SAMPLE_DEBTS.map(d=>normalizeDebt({...d,id:uid()}));
  if(!S.income)S.income=3100;
  S.onboarded=true;save();
}
function downloadFile(name,content,mime){
  const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const csvCell=v=>{const s=String(v);return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};

const ACT={
  tab:id=>{S.tab=id;save();render();window.scrollTo(0,0);},
  settings:()=>openModal({type:'settings'}),
  close:()=>closeModal(),
  overlay:(id,el,e)=>{if(e.target===el)closeModal();},
  undo:()=>{if(toastUndo){toastUndo();toastUndo=null;$('toast').innerHTML='';}},
  sample:()=>{loadSample();render();toast('Beispieldaten geladen');},
  welcomeSample:()=>{const inc=parseNum(val('f-inc'));if(inc>0)S.income=inc;loadSample();closeModal();render();toast('Beispieldaten geladen');},
  welcomeGo:()=>{
    const inc=parseNum(val('f-inc'));
    if(!(inc>0)){toast('Bitte Einkommen eingeben','err');return;}
    S.income=round2(inc);S.onboarded=true;save();closeModal();render();
    openModal({type:'debt'});
  },
  // Debts
  addDebt:()=>openModal({type:'debt'}),
  editDebt:id=>openModal({type:'debt',id}),
  pickIcon:id=>{U.modal.icon=id;document.querySelectorAll('#modal .emoji-row button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));},
  saveDebt:()=>{
    const name=val('f-name'),bal=parseNum(val('f-bal')),apr=parseNum(val('f-apr')||'0'),min=parseNum(val('f-min')||'0');
    const origIn=val('f-orig');const orig=origIn?parseNum(origIn):NaN;
    if(!name){toast('Bitte eine Bezeichnung eingeben','err');return;}
    if(!(bal>=0)){toast('Restbetrag ist ungültig','err');return;}
    if(!(apr>=0&&apr<100)){toast('Zinssatz ist ungültig','err');return;}
    if(!(min>=0)){toast('Mindestrate ist ungültig','err');return;}
    const m=U.modal;
    if(m.id){
      S.debts=S.debts.map(d=>d.id!==m.id?d:{...d,name,balance:round2(bal),apr,min:round2(min),icon:m.icon,orig:round2(Math.max(bal,orig>0?orig:d.orig))});
    }else{
      S.debts.push(normalizeDebt({id:uid(),name,balance:round2(bal),orig:orig>0?orig:bal,apr,min,icon:m.icon,color:DEBT_COLORS[S.debts.length%DEBT_COLORS.length]}));
    }
    S.onboarded=true;save();closeModal();render();toast(m.id?'Gespeichert':'Schuld hinzugefügt');
  },
  delDebt:id=>{
    const d=S.debts.find(x=>x.id===id);
    confirmDialog('Schuld löschen?',`„${d.name}“ wird entfernt.`,'Löschen',()=>{
      const idx=S.debts.indexOf(d);S.debts=S.debts.filter(x=>x.id!==id);save();render();
      toast('Gelöscht','ok',()=>{S.debts.splice(idx,0,d);save();render();});
    });
  },
  pay:id=>openModal({type:'pay',id}),
  savePay:id=>{
    const amt=parseNum(val('f-amt'));const date=val('f-date')||todayISO();
    if(!(amt>0)){toast('Bitte einen Betrag eingeben','err');return;}
    const before=S.debts.find(d=>d.id===id);
    const snap=JSON.parse(JSON.stringify(before));
    S.debts=S.debts.map(d=>d.id!==id?d:{...d,balance:round2(Math.max(0,d.balance-amt)),payments:[...d.payments,{date,amount:round2(amt)}].slice(-60)});
    save();closeModal();render();
    const now=S.debts.find(d=>d.id===id);
    toast(now.balance<=0?`🎉 ${now.name} ist abbezahlt!`:`${fmt2(amt)} verbucht 💪`,'ok',()=>{S.debts=S.debts.map(d=>d.id===id?snap:d);save();render();});
  },
  strategy:id=>{S.strategy=id;save();render();},
  // Expenses
  addExp:()=>openModal({type:'exp'}),
  editExp:id=>openModal({type:'exp',id}),
  saveExp:()=>{
    const name=val('f-name'),amt=parseNum(val('f-amt'));
    if(!name){toast('Bitte eine Bezeichnung eingeben','err');return;}
    if(!(amt>=0)){toast('Betrag ist ungültig','err');return;}
    const m=U.modal;
    if(m.id)S.expenses=S.expenses.map(e=>e.id!==m.id?e:{...e,name,amount:round2(amt),icon:m.icon});
    else S.expenses.push({id:uid(),name,amount:round2(amt),icon:m.icon});
    save();closeModal();render();
  },
  delExp:id=>{
    const e=S.expenses.find(x=>x.id===id);const idx=S.expenses.indexOf(e);
    S.expenses=S.expenses.filter(x=>x.id!==id);save();closeModal();render();
    toast('Gelöscht','ok',()=>{S.expenses.splice(idx,0,e);save();render();});
  },
  // Transactions
  addTx:()=>openModal({type:'tx'}),
  editTx:id=>openModal({type:'tx',id}),
  ttype:id=>{
    // keep typed values when switching type
    const keep={d:val('f-desc'),a:val('f-amt'),dt:val('f-date')};
    U.modal.ttype=id;renderModal();
    $('f-desc').value=keep.d;$('f-amt').value=keep.a;$('f-date').value=keep.dt;
  },
  saveTx:()=>{
    const desc=val('f-desc'),amt=parseNum(val('f-amt')),date=val('f-date'),cat=val('f-cat');
    if(!desc){toast('Bitte eine Beschreibung eingeben','err');return;}
    if(!(amt>0)){toast('Bitte einen gültigen Betrag eingeben','err');return;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('Bitte ein Datum wählen','err');return;}
    const m=U.modal;
    if(m.id){
      const t=S.transactions.find(x=>x.id===m.id);
      const learn=$('f-rule')?.checked&&cat!==t.category;
      Object.assign(t,{description:desc,amount:round2(amt),date,category:cat,type:m.ttype});
      let n=0;
      if(learn){
        const k=payeeKey(t.description);S.rules[ruleKey(t.description,t.type==='einnahme')]=cat;
        for(const x of S.transactions)if(x!==t&&x.type===t.type&&payeeKey(x.description)===k&&x.category!==cat){x.category=cat;n++;}
      }
      sortTx(S.transactions);save();closeModal();render();
      toast(n?`Gespeichert · ${n} weitere angepasst`:'Gespeichert');
    }else{
      S.transactions.unshift({id:uid(),date,description:desc,purpose:'',category:cat,amount:round2(amt),type:m.ttype,src:'manual'});
      sortTx(S.transactions);save();closeModal();render();toast('Buchung hinzugefügt');
    }
  },
  delTx:id=>{
    const t=S.transactions.find(x=>x.id===id);
    S.transactions=S.transactions.filter(x=>x.id!==id);save();closeModal();render();
    toast('Buchung gelöscht','ok',()=>{S.transactions.push(t);sortTx(S.transactions);save();render();});
  },
  moreTx:()=>{U.txLimit+=300;$('tx-list').innerHTML=txListHTML();},
  showCat:id=>{U.txCat=id;U.txQuery='';S.tab='transactions';render();window.scrollTo(0,0);},
  importCsv:()=>$('file-csv').click(),
  exportCsv:()=>{
    if(!S.transactions.length){toast('Keine Buchungen vorhanden','err');return;}
    // Semicolon + decimal comma so German Excel opens it correctly.
    const rows=[['Datum','Beschreibung','Verwendungszweck','Kategorie','Betrag (EUR)','Typ'],
      ...S.transactions.map(t=>[fmtDate(t.date),t.description,t.purpose,t.category,(t.type==='ausgabe'?-t.amount:t.amount).toFixed(2).replace('.',','),t.type==='ausgabe'?'Ausgabe':'Einnahme'])];
    downloadFile(`debtfree-buchungen-${todayISO()}.csv`,'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');
    toast('Exportiert – in Excel öffnen');
  },
  anaRange:id=>{U.anaRange=id;render();},
  // Settings
  backup:()=>{downloadFile(`debtfree-backup-${todayISO()}.json`,JSON.stringify({app:'DebtFree',exported:new Date().toISOString(),data:S},null,1),'application/json');toast('Backup gespeichert');},
  restore:()=>$('file-backup').click(),
  clearRules:()=>{S.rules={};save();renderModal();toast('Zuordnungen zurückgesetzt');},
  pinChange:()=>{closeModal();showPin('setup');},
  pinOff:()=>{try{localStorage.setItem(PIN_KEY,'off');localStorage.removeItem(LEGACY_PIN_KEY);}catch{}renderModal();toast('PIN-Sperre deaktiviert');},
  wipe:()=>confirmDialog('Alle Daten löschen?','Schulden, Budget, Buchungen und PIN werden unwiderruflich von diesem Gerät entfernt. Erstelle vorher ein Backup, wenn du sie behalten willst.','Endgültig löschen',()=>{wipeAll();location.reload();}),
  confirmOk:()=>{const fn=confirmFn;confirmFn=null;closeModal();if(fn)fn();},
};

document.addEventListener('click',e=>{
  const pin=e.target.closest('[data-pin]');
  if(pin&&!pin.disabled){const k=pin.dataset.pin;pinKey(/^\d$/.test(k)?+k:k);return;}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const fn=ACT[el.dataset.act];
  if(fn)fn(el.dataset.id,el,e);
});
document.addEventListener('change',e=>{
  const el=e.target;const k=el.dataset.change;if(!k)return;
  if(k==='income'){const v=parseNum(el.value);if(v>=0){S.income=round2(v);save();}render();}
  else if(k==='expAmount'){const v=parseNum(el.value);if(v>=0){S.expenses=S.expenses.map(x=>x.id===el.dataset.id?{...x,amount:round2(v)}:x);save();}else toast('Ungültiger Betrag','err');render();}
  else if(k==='txCat'){U.txCat=el.value;U.txLimit=150;$('tx-list').innerHTML=txListHTML();}
});
document.addEventListener('input',e=>{
  const el=e.target;const k=el.dataset.input;if(!k)return;
  if(k==='txQuery'){U.txQuery=el.value;U.txLimit=150;$('tx-list').innerHTML=txListHTML();}
  else if(k==='whatIf'){
    U.whatIf=+el.value;const f=figures();
    const simW=U.whatIf>0?simulate(S.debts,f.budget,S.strategy,U.whatIf):null;
    $('wi-val').textContent=`+${fmt(U.whatIf)}/Mo.`;$('wi-res').innerHTML=whatIfText(f,simW);
  }
});
// Re-render the plan chart once the slider is released (cheap enough, avoids jank while dragging)
document.addEventListener('change',e=>{if(e.target.dataset.input==='whatIf')render();});
document.addEventListener('keydown',e=>{
  if(!$('pin-screen').hidden&&!U.modal){
    if(/^\d$/.test(e.key))pinKey(+e.key);else if(e.key==='Backspace')pinKey('del');
    return;
  }
  if(e.key==='Escape'&&U.modal)closeModal();
  if(e.key==='Enter'&&U.modal&&e.target.tagName==='INPUT'){
    const btn=document.querySelector('#modal .btn-p');if(btn){e.preventDefault();btn.click();}
  }
});
$('file-csv').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';importFile(f);});
$('file-backup').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{
    const j=JSON.parse(await file.text());
    const data=j&&j.data?j.data:j;
    if(!data||!Array.isArray(data.debts)||!Array.isArray(data.transactions))throw new Error();
    confirmDialog('Backup einspielen?',`Aktuelle Daten werden ersetzt durch: ${data.debts.length} Schulden, ${data.transactions.length} Buchungen.`,'Ersetzen',()=>{
      S=hydrate({...data,onboarded:true});save();render();toast('Backup eingespielt');
    });
  }catch{toast('Keine gültige DebtFree-Backupdatei','err');}
});
// Drag & drop anywhere on the analytics/transactions page
['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  if(!U.unlocked||!e.dataTransfer||![...e.dataTransfer.types].includes('Files'))return;
  e.preventDefault();
  if(ev==='drop'&&e.dataTransfer.files[0])importFile(e.dataTransfer.files[0]);
}));

// ── Boot ─────────────────────────────────────────────────────────────────────
load();
if(needsPin())showPin('unlock');
else if(!pinDisabled()&&!S.onboarded)showPin('setup');
else unlockApp();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>

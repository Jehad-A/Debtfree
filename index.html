<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="DebtFree"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>

  <title>DebtFree</title>
<style>
:root {
  --bg: #0a0a0f;
  --card: #111118;
  --border: #1c1c28;
  --text: #e8e8f0;
  --muted: #44445a;
  --green: #00e5a0;
  --red: #ff4566;
  --amber: #ffb344;
  --blue: #4488ff;
  --purple: #9966ff;
  --pink: #ff44aa;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;overscroll-behavior:none}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#root{max-width:430px;margin:0 auto;min-height:100vh}

/* ══ PIN SCREEN ══════════════════════════════════════════════════════════ */
.pin-wrap{
  position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 28px calc(32px + env(safe-area-inset-bottom));
}
.pin-glow{
  width:80px;height:80px;border-radius:24px;
  background:linear-gradient(135deg,#00e5a0 0%,#4488ff 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;margin-bottom:20px;
  box-shadow:0 0 40px rgba(0,229,160,0.25);
}
.pin-title{font-size:26px;font-weight:800;letter-spacing:-0.5px}
.pin-sub{color:var(--muted);font-size:13px;margin-top:4px;margin-bottom:36px}
.pin-dots{display:flex;gap:16px;margin-bottom:40px}
.pin-dot{
  width:13px;height:13px;border-radius:50%;
  border:2px solid var(--border);transition:all 0.15s;
}
.pin-dot.on{background:var(--green);border-color:var(--green);transform:scale(1.15)}
.pin-dot.err{background:var(--red);border-color:var(--red)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:270px}
.pk{
  aspect-ratio:1;border-radius:50%;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:22px;font-weight:700;
  cursor:pointer;font-family:'Syne',sans-serif;
  display:flex;align-items:center;justify-content:center;transition:all 0.1s;
}
.pk:active{transform:scale(0.9);background:var(--border)}
.pk.ghost{background:transparent;border:none;cursor:default}
.pk.del{font-size:17px}
.pin-hint{color:var(--muted);font-size:12px;margin-top:24px;text-align:center;line-height:1.7;max-width:240px}
.pin-err{color:var(--red);font-size:12px;height:16px;margin-bottom:12px;text-align:center}

/* ══ HEADER ══════════════════════════════════════════════════════════════ */
.hdr{
  padding:calc(48px + env(safe-area-inset-top)) 22px 20px;
  background:linear-gradient(175deg,#0f0f1e 0%,var(--bg) 100%);
  position:relative;overflow:hidden;
}
.hdr::after{
  content:'';position:absolute;top:-80px;right:-60px;
  width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,229,160,0.06) 0%,transparent 65%);
  pointer-events:none;
}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start}
.hdr-lbl{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.hdr-amt{font-size:42px;font-weight:800;letter-spacing:-2px;font-family:'JetBrains Mono',monospace;line-height:1}
.hdr-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.badge-green{background:rgba(0,229,160,0.1);border:1px solid rgba(0,229,160,0.3);border-radius:30px;padding:5px 12px;font-size:11px;color:var(--green);font-weight:700}
.badge-sub{color:var(--muted);font-size:10px}

/* ══ DEBT CARDS ══════════════════════════════════════════════════════════ */
.debts{padding:14px 14px 0}
.dc{background:var(--card);border-radius:18px;padding:15px;margin-bottom:10px;border:1px solid var(--border)}
.dc-top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.dc-ico{font-size:20px}
.dc-name{font-weight:700;font-size:14px}
.dc-meta{color:var(--muted);font-size:11px;margin-top:1px}
.dc-bal{font-weight:800;font-size:16px;font-family:'JetBrains Mono',monospace;margin-left:auto}
.pbar{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.pfill{height:100%;border-radius:99px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.dc-bot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dc-pct{font-size:11px;font-weight:700}
.pay-btn{border:1px solid;border-radius:20px;padding:3px 13px;background:transparent;cursor:pointer;font-size:11px;font-weight:700;font-family:'Syne',sans-serif}

/* ══ LAYOUT ══════════════════════════════════════════════════════════════ */
.content{padding:14px 14px 110px}
.stitle{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;margin:20px 0 10px;font-weight:700}

/* ══ CARDS ═══════════════════════════════════════════════════════════════ */
.row2{display:flex;gap:10px;margin-bottom:4px}
.scard{flex:1;background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--border)}
.scard-lbl{color:var(--muted);font-size:10px;margin-bottom:5px;letter-spacing:1px;text-transform:uppercase}
.scard-val{font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace}

/* ══ ANALYTICS ═══════════════════════════════════════════════════════════ */
.analytics-hero{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:22px;margin-bottom:12px;
}
.upload-zone{
  border:2px dashed var(--border);border-radius:16px;padding:32px 20px;
  text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:12px;
}
.upload-zone:hover,.upload-zone.drag{border-color:var(--green);background:rgba(0,229,160,0.04)}
.upload-icon{font-size:40px;margin-bottom:10px}
.upload-title{font-weight:700;font-size:15px;margin-bottom:4px}
.upload-sub{color:var(--muted);font-size:12px;line-height:1.6}
.upload-formats{display:flex;gap:8px;justify-content:center;margin-top:12px}
.fmt-badge{background:var(--border);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--muted);font-weight:700}
.fmt-badge.active{background:rgba(0,229,160,0.15);color:var(--green);border:1px solid rgba(0,229,160,0.3)}

/* ── Bar Chart ── */
.chart-wrap{background:var(--card);border-radius:18px;padding:18px;margin-bottom:12px;border:1px solid var(--border)}
.chart-title{font-weight:700;font-size:14px;margin-bottom:4px}
.chart-sub{color:var(--muted);font-size:11px;margin-bottom:18px}
.bar-item{margin-bottom:14px}
.bar-label{display:flex;justify-content:space-between;margin-bottom:5px}
.bar-name{font-size:13px;color:var(--text);display:flex;align-items:center;gap:7px}
.bar-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bar-amt{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--muted)}
.bar-track{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-pct{font-size:10px;color:var(--muted);margin-top:3px;text-align:right}

/* ── Donut Chart ── */
.donut-wrap{background:var(--card);border-radius:18px;padding:18px;margin-bottom:12px;border:1px solid var(--border)}
.donut-inner{display:flex;gap:20px;align-items:center}
.donut-canvas{flex-shrink:0}
.donut-legend{flex:1}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-name{font-size:12px;color:var(--text);flex:1}
.legend-pct{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--muted);font-weight:700}

/* ── Monthly Trend ── */
.trend-wrap{background:var(--card);border-radius:18px;padding:18px;margin-bottom:12px;border:1px solid var(--border)}
.trend-canvas{width:100%;height:140px}
.month-labels{display:flex;justify-content:space-between;margin-top:6px;padding:0 4px}
.month-lbl{font-size:10px;color:var(--muted)}

/* ── Insights ── */
.insight-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;border:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.insight-ico{font-size:22px;flex-shrink:0}
.insight-title{font-weight:700;font-size:13px;margin-bottom:2px}
.insight-body{color:var(--muted);font-size:12px;line-height:1.5}
.insight-card.warn{border-left:3px solid var(--red)}
.insight-card.good{border-left:3px solid var(--green)}
.insight-card.info{border-left:3px solid var(--blue)}

/* ── AI Processing ── */
.ai-processing{text-align:center;padding:32px 20px}
.ai-spinner{width:48px;height:48px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--green);animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-label{font-weight:700;font-size:15px;margin-bottom:6px}
.ai-sub{color:var(--muted);font-size:12px;line-height:1.6}

/* ══ TRANSACTIONS ════════════════════════════════════════════════════════ */
.tx{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border)}
.tx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tx-desc{font-size:13px;font-weight:600;color:var(--text)}
.tx-meta{font-size:11px;color:var(--muted);margin-top:2px}
.tx-amt{font-weight:700;font-size:13px;font-family:'JetBrains Mono',monospace;margin-left:auto;white-space:nowrap}
.empty{text-align:center;padding:56px 20px}
.empty-ico{font-size:48px}
.empty-lbl{color:var(--muted);margin-top:10px;font-size:13px}
.empty-sub{color:#2a2a3a;font-size:11px;margin-top:4px}

/* ══ BUDGET ══════════════════════════════════════════════════════════════ */
.bsum{background:var(--card);border-radius:18px;padding:18px;margin-bottom:8px;border:1px solid var(--border)}
.bi{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:var(--muted)}
.bi.total{border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
.brow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:8px;border:1px solid var(--border)}
.aedit{display:flex;align-items:center;background:var(--bg);border-radius:10px;padding:5px 10px}
.esign{color:var(--muted);font-size:13px;margin-right:2px}
.einput{background:transparent;border:none;color:var(--text);font-weight:700;font-size:14px;width:64px;outline:none;text-align:right;font-family:'JetBrains Mono',monospace}

/* ══ PLAN ════════════════════════════════════════════════════════════════ */
.plan-hero{background:linear-gradient(135deg,#0f0f20,#0a1828);border-radius:22px;padding:26px;text-align:center;margin-bottom:8px;border:1px solid #1a2a40}
.ph-lbl{color:var(--muted);font-size:10px;letter-spacing:3px;text-transform:uppercase}
.ph-num{font-size:58px;font-weight:800;color:var(--green);line-height:1;font-family:'JetBrains Mono',monospace;margin:8px 0 4px}
.ph-sub{color:var(--muted);font-size:12px}
.phase{background:var(--card);border-radius:15px;padding:15px;margin-bottom:9px;border-left:3px solid;border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.phase-name{font-weight:700;font-size:14px}
.phase-meta{color:var(--muted);font-size:12px;margin-top:3px}
.phase-chips{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.chip{background:var(--bg);border-radius:20px;padding:3px 11px;font-size:11px;color:var(--muted)}
.tip{display:flex;gap:11px;align-items:flex-start;background:var(--card);border-radius:14px;padding:13px;margin-bottom:8px;border:1px solid var(--border)}
.tip-t{font-weight:700;font-size:13px}
.tip-m{color:var(--muted);font-size:12px;margin-top:2px}

/* ══ MODAL ════════════════════════════════════════════════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:flex-end;z-index:300;backdrop-filter:blur(6px)}
.mbox{background:var(--card);border-radius:24px 24px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));width:100%;max-width:430px;margin:0 auto;border-top:1px solid var(--border)}
.mhandle{width:34px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 18px}
.mtitle{font-weight:800;font-size:19px;margin-bottom:16px}
.ifield{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 15px;color:var(--text);font-size:14px;margin-bottom:9px;outline:none;font-family:'Syne',sans-serif}
.ifield:focus{border-color:var(--green)}
.brow2{display:flex;gap:9px;margin-top:4px}
.btn-p{flex:1;background:var(--green);border:none;border-radius:13px;padding:14px;color:#000;font-weight:800;font-size:15px;cursor:pointer;font-family:'Syne',sans-serif}
.btn-g{flex:1;background:transparent;border:1px solid var(--border);border-radius:13px;padding:14px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;font-family:'Syne',sans-serif}

/* ══ FAB ══════════════════════════════════════════════════════════════════ */
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));right:18px;width:54px;height:54px;border-radius:50%;background:var(--green);border:none;color:#000;font-size:26px;font-weight:700;cursor:pointer;z-index:50;box-shadow:0 4px 24px rgba(0,229,160,0.3);display:flex;align-items:center;justify-content:center}

/* ══ NAV ══════════════════════════════════════════════════════════════════ */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,10,15,0.95);border-top:1px solid var(--border);display:flex;padding:9px 0 calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.nb{background:none;border:none;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;font-family:'Syne',sans-serif;transition:color 0.15s}
.nb.on{color:var(--green)}
.nb-ico{font-size:20px}
.nb-lbl{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase}

/* ══ TOAST ════════════════════════════════════════════════════════════════ */
.toast{position:fixed;top:calc(18px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:30px;font-weight:700;font-size:13px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.5);animation:tin 0.3s ease;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.fade{animation:fin 0.3s ease both}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
select.ifield option{background:var(--card)}
</style>
</head>

const CAT_COLORS_MAP = {};
Object.values(DE_CATEGORIES).forEach(v => { CAT_COLORS_MAP[v.cat] = v.color; });

// ══ INITIAL DATA ══════════════════════════════════════════════════════════════

let P={digits:[],step:1,first:'',err:''};

function getPIN(){try{return localStorage.getItem('df3_pin')||'';}catch{return '';}}
function setPIN(p){try{localStorage.setItem('df3_pin',p);}catch{}}
function hasPIN(){return getPIN().length===4;}

function renderPIN(){
  const el=document.getElementById('pin-screen');
  const setup=!hasPIN();
  const lbl=setup?(P.step===1?'PIN erstellen':'PIN bestätigen'):'PIN eingeben';
  el.innerHTML=`
    <div class="pin-wrap">
      <div class="pin-glow">💰</div>
      <div class="pin-title">DebtFree</div>
      <div class="pin-sub">${lbl}</div>
      <div class="pin-err">${P.err}</div>
      <div class="pin-dots">
        ${[0,1,2,3].map(i=>`<div class="pin-dot ${P.digits.length>i?'on':''} ${P.err&&P.digits.length===0?'err':''}"></div>`).join('')}
      </div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pk" onclick="pk(${n})">${n}</button>`).join('')}
        <div class="pk ghost"></div>
        <button class="pk" onclick="pk(0)">0</button>
        <button class="pk del" onclick="pdel()">⌫</button>
      </div>
      <div class="pin-hint">${setup?'Erstelle einen 4-stelligen PIN für die App':'Gib deinen PIN ein um fortzufahren'}</div>
    </div>`;
}

function pk(n){
  if(P.digits.length>=4)return;
  P.digits.push(n);P.err='';renderPIN();
  if(P.digits.length===4)setTimeout(psubmit,130);
}
function pdel(){P.digits.pop();P.err='';renderPIN();}
function psubmit(){
  const entered=P.digits.join('');
  if(!hasPIN()){
    if(P.step===1){P.first=entered;P.step=2;P.digits=[];renderPIN();}
    else if(entered===P.first){setPIN(entered);unlockApp();}
    else{P.err='PINs stimmen nicht überein';P.digits=[];P.step=1;P.first='';renderPIN();}
  } else {
    if(entered===getPIN()){unlockApp();}
    else{P.err='Falscher PIN';P.digits=[];setTimeout(renderPIN,60);}
  }
}
function unlockApp(){
  document.getElementById('pin-screen').style.display='none';
  document.getElementById('root').style.display='block';
  render();
}

const fmt=n=>'€'+Math.round(n).toLocaleString('de-DE');
const fmtDec=n=>'€'+parseFloat(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});

function calcMonths(){
  let ds=S.debts.map(d=>({...d,balance:parseFloat(d.balance)}));
  const totalExp=S.expenses.reduce((s,e)=>s+e.amount,0);
  const surplus=INCOME-totalExp;
  let m=0;
  while(ds.some(d=>d.balance>0)&&m<600){
    m++;
    ds=ds.map(d=>({...d,balance:d.balance>0?d.balance*(1+d.apr/100/12):0}));
    let rem=surplus;
    ds=ds.map(d=>{if(d.balance<=0)return d;const p=Math.min(d.min,d.balance);rem-=p;return{...d,balance:d.balance-p};});
    const tgts=[...ds].filter(d=>d.balance>0).sort((a,b)=>b.apr-a.apr);
    for(const t of tgts){if(rem<=0)break;const i=ds.findIndex(d=>d.id===t.id);const p=Math.min(rem,ds[i].balance);ds[i]={...ds[i],balance:ds[i].balance-p};rem-=p;}
    ds=ds.map(d=>({...d,balance:Math.max(0,d.balance)}));
  }
  return m;
}

// ══ SPARKASSE CSV PARSER ══════════════════════════════════════════════════════
// Sparkasse CSV format: Auftragskonto;Buchungstag;Valutadatum;Buchungstext;Auftraggeber/Beguenstigter;Kontonummer;BLZ;Betrag;Gläubiger-ID;Mandatsreferenz;Kundenreferenz
function parseSparkasseCSV(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const txs=[];
  let dataStart=false;

  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    // Detect header row
    if(line.toLowerCase().includes('buchungstag')&&line.toLowerCase().includes('betrag')){
      dataStart=true;continue;
    }
    if(!dataStart)continue;

    // Handle semicolon-separated, possibly quoted
    const cols=parseCSVLine(line,';');
    if(cols.length<8)continue;

    // Find date, description, amount columns
    // Standard Sparkasse: [0]=Konto [1]=Buchungstag [2]=Valuta [3]=Buchungstext [4]=Auftraggeber [5]=Ktonr [6]=BLZ [7]=Betrag
    const dateStr=cols[1]||cols[2]||'';
    const buchungstext=cols[3]||'';
    const auftraggeber=cols[4]||'';
    const betragStr=(cols[7]||'').replace('.','').replace(',','.');
    const betrag=parseFloat(betragStr);

    if(!dateStr||isNaN(betrag))continue;

    // Parse German date DD.MM.YYYY → YYYY-MM-DD
    const dateParts=dateStr.split('.');
    let isoDate=dateStr;
    if(dateParts.length===3){
      isoDate=`${dateParts[2]}-${dateParts[1].padStart(2,'0')}-${dateParts[0].padStart(2,'0')}`;
    }

    const desc=(auftraggeber||buchungstext).substring(0,60);
    const {cat,color}=categorize(desc+' '+buchungstext);

    txs.push({id:Date.now()+Math.random(),date:isoDate,description:desc.trim()||'Buchung',category:cat,color,amount:Math.abs(betrag),type:betrag<0?'ausgabe':'einnahme',raw:line});
  }
  return txs;
}

function parseCSVLine(line,sep=','){
  const result=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===sep&&!inQ){result.push(cur.trim());cur='';}
    else{cur+=c;}
  }
  result.push(cur.trim());
  return result;
}

function categorize(text){
  const lower=text.toLowerCase();
  for(const [keyword,data] of Object.entries(DE_CATEGORIES)){
    if(lower.includes(keyword))return data;
  }
  return{cat:'Sonstiges',color:'#666688'};
}

// ══ AI PDF PARSER (using Claude API) ══════════════════════════════════════════
async function parsePDFWithAI(file){
  // Extract text from PDF using pdf.js
  const pdfjsLib=window.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  const arrayBuffer=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let fullText='';
  for(let i=1;i<=Math.min(pdf.numPages,20);i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    fullText+=content.items.map(item=>item.str).join(' ')+'\n';
  }

  // Send to Claude API for intelligent German banking extraction
  const prompt=`Du bist ein Experte für deutsche Kontoauszüge, speziell von der Sparkasse.

Analysiere diesen Kontoauszug-Text und extrahiere ALLE Transaktionen als JSON Array.

Für jede Transaktion:
- date: Datum im Format YYYY-MM-DD (konvertiere DD.MM.YYYY)
- description: Beschreibung/Empfänger (max 50 Zeichen)  
- amount: Betrag als positive Zahl (ohne € Zeichen)
- type: "ausgabe" wenn Geld abgebucht, "einnahme" wenn Geld eingegangen

Kontoauszug Text:
${fullText.substring(0,6000)}

Antworte NUR mit einem JSON Array, kein anderer Text:
[{"date":"2024-01-15","description":"REWE Markt","amount":45.80,"type":"ausgabe"},...]`;

  const response=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:4000,
      messages:[{role:'user',content:prompt}]
    })
  });

  if(!response.ok)throw new Error('API Fehler: '+response.status);
  const data=await response.json();
  const text=data.content.map(c=>c.text||'').join('');
  const clean=text.replace(/```json|```/g,'').trim();
  const parsed=JSON.parse(clean);

  return parsed.map((t,i)=>{
    const{cat,color}=categorize(t.description);
    return{id:Date.now()+i,date:t.date,description:t.description,category:cat,color,amount:Math.abs(parseFloat(t.amount)||0),type:t.type||'ausgabe'};
  });
}

// ══ ANALYTICS ENGINE ══════════════════════════════════════════════════════════
function buildAnalytics(txs){
  const ausgaben=txs.filter(t=>t.type==='ausgabe');
  const einnahmen=txs.filter(t=>t.type==='einnahme');

  // Category totals
  const catMap={};
  ausgaben.forEach(t=>{
    if(!catMap[t.category])catMap[t.category]={total:0,color:t.color,count:0};
    catMap[t.category].total+=t.amount;
    catMap[t.category].count++;
  });
  const cats=Object.entries(catMap).map(([name,d])=>({name,...d})).sort((a,b)=>b.total-a.total);

  // Monthly totals (last 6 months)
  const monthMap={};
  ausgaben.forEach(t=>{
    const m=t.date.substring(0,7);
    if(!monthMap[m])monthMap[m]=0;
    monthMap[m]+=t.amount;
  });
  const months=Object.entries(monthMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);

  // Total stats
  const totalOut=ausgaben.reduce((s,t)=>s+t.amount,0);
  const totalIn=einnahmen.reduce((s,t)=>s+t.amount,0);
  const avgMonthly=totalOut/Math.max(1,months.length);

  // Insights
  const insights=[];
  if(cats[0]&&cats[0].total>avgMonthly*0.3){
    insights.push({type:'warn',ico:'⚠️',title:`${cats[0].name} ist deine größte Ausgabe`,body:`Du hast ${fmt(cats[0].total)} ausgegeben — ${Math.round(cats[0].total/totalOut*100)}% deiner Gesamtausgaben. Hier lässt sich am meisten sparen.`});
  }
  const dining=cats.find(c=>c.name==='Restaurant'||c.name==='Lieferservice');
  if(dining&&dining.total>200){
    insights.push({type:'warn',ico:'🍔',title:'Hohe Gastro-Ausgaben',body:`${fmt(dining.total)} für Restaurants/Lieferservice. Meal-Prepping könnte dir über ${fmt(dining.total*0.5)} monatlich sparen.`});
  }
  const subs=cats.find(c=>c.name==='Abos');
  if(subs&&subs.count>3){
    insights.push({type:'info',ico:'📺',title:`${subs.count} Abos aktiv`,body:`Du zahlst ${fmt(subs.total)} für Abonnements. Prüfe welche du wirklich nutzt — jeder gesparte Euro geht auf die Kreditkarte.`});
  }
  if(avgMonthly<1500){
    insights.push({type:'good',ico:'✅',title:'Ausgaben unter Kontrolle',body:`Dein monatlicher Durchschnitt liegt bei ${fmt(avgMonthly)}. Damit hast du einen guten Puffer für die Schuldentilgung.`});
  }

  return{cats,months,totalOut,totalIn,avgMonthly,txCount:txs.length,insights};
}

// ══ ANALYTICS STATE ═══════════════════════════════════════════════════════════
let analyticsData=null;
let analyticsLoading=false;
let analyticsError='';

async function handleFile(file){
  analyticsLoading=true;analyticsError='';render();
  try{
    let txs=[];
    if(file.name.toLowerCase().endsWith('.csv')||file.type.includes('csv')){
      const text=await file.text();
      txs=parseSparkasseCSV(text);
      if(txs.length===0)throw new Error('Keine Transaktionen gefunden. Bitte Sparkasse CSV exportieren.');
    } else if(file.name.toLowerCase().endsWith('.pdf')||file.type.includes('pdf')){
      txs=await parsePDFWithAI(file);
    } else {
      throw new Error('Bitte eine CSV oder PDF Datei hochladen.');
    }
    analyticsData=buildAnalytics(txs);
    // Also merge into main transactions
    S.transactions=[...txs,...S.transactions].slice(0,500);
    save();
    toast(`${txs.length} Transaktionen analysiert ✅`);
  } catch(e){
    analyticsError=e.message||'Fehler beim Lesen der Datei';
    toast(analyticsError,'err');
  }
  analyticsLoading=false;render();
}

// ══ CANVAS CHARTS ══════════════════════════════════════════════════════════════
function drawDonut(cats){
  const canvas=document.getElementById('donut-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const cx=65,cy=65,r=55,iR=32;
  const total=cats.reduce((s,c)=>s+c.total,0);
  ctx.clearRect(0,0,130,130);
  let angle=-Math.PI/2;
  cats.slice(0,6).forEach(c=>{
    const slice=(c.total/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle,angle+slice);
    ctx.closePath();
    ctx.fillStyle=c.color;
    ctx.fill();
    angle+=slice;
  });
  // Inner circle (donut hole)
  ctx.beginPath();
  ctx.arc(cx,cy,iR,0,Math.PI*2);
  ctx.fillStyle='#16161f';
  ctx.fill();
  // Center text
  ctx.fillStyle='#e8e8f0';
  ctx.font='bold 11px JetBrains Mono';
  ctx.textAlign='center';
  ctx.fillText(cats.length+' Kat.',cx,cy+4);
}

function drawTrend(months){
  const canvas=document.getElementById('trend-canvas');
  if(!canvas||!months.length)return;
  const W=canvas.offsetWidth||canvas.width;canvas.width=W;
  const H=140;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const vals=months.map(([,v])=>v);
  const max=Math.max(...vals)*1.1;
  const pad={l:8,r:8,t:10,b:20};
  const W2=W-pad.l-pad.r;const H2=H-pad.t-pad.b;

  // Grid lines
  ctx.strokeStyle='#1c1c28';ctx.lineWidth=1;
  [0.25,0.5,0.75,1].forEach(f=>{
    const y=pad.t+H2*(1-f);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
  });

  // Gradient fill
  const pts=vals.map((v,i)=>({x:pad.l+(i/(vals.length-1||1))*W2,y:pad.t+H2*(1-v/max)}));
  const grad=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
  grad.addColorStop(0,'rgba(0,229,160,0.25)');
  grad.addColorStop(1,'rgba(0,229,160,0.0)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x,H-pad.b);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,H-pad.b);
  ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();

  // Line
  ctx.beginPath();ctx.strokeStyle='#00e5a0';ctx.lineWidth=2.5;ctx.lineJoin='round';
  pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.stroke();

  // Dots
  pts.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle='#00e5a0';ctx.fill();
  });
}

// ══ ACTIONS ════════════════════════════════════════════════════════════════════
function setTab(t){S.tab=t;render();window.scrollTo(0,0);}
function openTx(){S.showTx=true;render();}
function closeModal(e){if(e.target.classList.contains('overlay')){S.showTx=false;render();}}

function payDebt(id){
  const totalExp=S.expenses.reduce((s,e)=>s+e.amount,0);
  const surplus=INCOME-totalExp;
  const totalMin=S.debts.reduce((s,d)=>s+d.min,0);
  const afterMin=Math.max(0,surplus-totalMin);
  const maxApr=Math.max(...S.debts.map(d=>d.apr));
  const debt=S.debts.find(d=>d.id===id);
  S.debts=S.debts.map(d=>{
    if(d.id!==id)return d;
    const extra=d.apr===maxApr?afterMin:0;
    return{...d,balance:Math.max(0,parseFloat(d.balance)-d.min-extra)};
  });
  save();toast(`Zahlung für ${debt.name} verbucht 💪`);
}

function addTx(){
  const t=S.newTx;
  if(!t.desc||!t.amt){toast('Bitte alle Felder ausfüllen','err');return;}
  const{cat,color}=categorize(t.desc);
  S.transactions=[{id:Date.now(),date:t.date,description:t.desc,category:t.cat||cat,color,amount:parseFloat(t.amt),type:t.type},...S.transactions];
  S.showTx=false;
  S.newTx={desc:'',amt:'',cat:'Lebensmittel',type:'ausgabe',date:new Date().toISOString().split('T')[0]};
  save();toast('Buchung hinzugefügt ✅');
}

function updateExp(id,val){
  S.expenses=S.expenses.map(e=>e.id===id?{...e,amount:parseFloat(val)||0}:e);
  save();render();
}

function exportCSV(){
  if(!S.transactions.length){toast('Keine Buchungen vorhanden','err');return;}
  const rows=[['Datum','Beschreibung','Kategorie','Betrag (€)','Typ'],...S.transactions.map(t=>[t.date,`"${t.description}"`,t.category,t.amount.toFixed(2),t.type])];
  const csv=rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download=`sparkasse-auswertung-${new Date().toISOString().split('T')[0]}.csv`;a.click();
  toast('Exportiert! In Excel öffnen 📊');
}

function handleFileInput(e){
  const file=e.target.files[0];if(!file)return;
  S.tab='analytics';
  handleFile(file);
}

function handleDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('drag');
  const file=e.dataTransfer.files[0];if(!file)return;
  handleFile(file);
}
